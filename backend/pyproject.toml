[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alex-database",
    "boto3>=1.40.29",
    "langfuse>=3.3.4",
    "openai-agents>=0.3.0",
    "pydantic-ai>=1.0.6",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.2",
    "pytest>=8.0.0",
    "litellm==1.91.4",
    "tenacity>=8.0.0",
    "polygon-api-client>=1.16.3",
    "fastapi>=0.116.1",
    "fastapi-clerk-auth>=0.0.7",
    "httpx>=0.28.1",
    "mangum>=0.19.0",
]

[tool.uv.workspace]
members = [
    "database",
    "api",
    "scheduler",
]

[tool.uv.sources]
alex-database = { workspace = true }

[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Alex Backend"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
boto3 = ">=1.40.29"
langfuse = ">=3.3.4"
openai-agents = ">=0.3.0"
pydantic-ai = ">=1.0.6"
python-dotenv = ">=1.1.1"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [
  ".",
  "scheduler",
  "planner",
  "database",
  "database/src",
  "api",
]
