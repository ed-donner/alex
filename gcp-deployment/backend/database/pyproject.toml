[project]
name = "alex-database"
version = "0.1.0"
description = "Database package for Alex Financial Planner with Aurora Data API"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.8", # For Aurora Data API (backward compatibility)
    "psycopg2-binary>=2.9.9", # For Cloud SQL PostgreSQL
    "cloud-sql-python-connector>=1.11.0", # For Cloud SQL on Cloud Run
    "pg8000>=1.31.2", # Required by Cloud SQL connector for PostgreSQL
    "google-cloud-secret-manager>=2.18.0", # For retrieving passwords
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
